name: Build & Release Media Downloader Pro

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_pattern: dist/*.zip
            platform: windows
          - os: ubuntu-latest
            artifact_pattern: dist/*.tar.gz
            platform: linux
          - os: macos-latest
            artifact_pattern: dist/*.zip
            platform: macos

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Windows: Instalar FFmpeg
      - name: Instalar FFmpeg en Windows
        if: matrix.platform == 'windows'
        run: |
          choco install ffmpeg -y

      # Linux: Instalar FFmpeg
      - name: Instalar FFmpeg en Linux
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # macOS: Instalar FFmpeg
      - name: Instalar FFmpeg en macOS
        if: matrix.platform == 'macos'
        run: |
          brew install ffmpeg

      - name: Compilar y Empaquetar con PyInstaller
        run: |
          python build_app.py

      - name: Subir Artefacto Compilado
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: ${{ matrix.artifact_pattern }}
          retention-days: 5

  release:
    name: Publicar GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Todos los Artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Crear o Actualizar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.0.0' }}
          name: Media Downloader Pro ${{ github.ref_type == 'tag' && github.ref_name || 'v2.0.0' }}
          draft: false
          prerelease: false
          files: artifacts/**/*
          body: |
            ## 🚀 Media Downloader Pro V2.0 — Descargas Oficiales

            ¡Bienvenido a la versión definitiva de **Media Downloader Pro**!
            Descargas de escritorio portables sin necesidad de instalar Python ni ejecutar comandos en la terminal.

            ---

            ### 📦 Paquetes Listos para Descargar:
            * 🟦 **Windows (x64):** `MediaDownloaderPro-Windows-x64.zip`  
              *(Incluye FFmpeg integrado; descomprimir y ejecutar `MediaDownloaderPro.exe`)*
            * 🐧 **Linux (x64):** `MediaDownloaderPro-Linux-x64.tar.gz`  
              *(Descomprimir y ejecutar `./MediaDownloaderPro`)*
            * 🍎 **macOS (x64 / Apple Silicon):** `MediaDownloaderPro-macOS-x64.zip`  
              *(Descomprimir y abrir la aplicación)*

            ---

            ### ✨ Funciones Destacadas V2.0:
            * **Descargas Paralelas:** Hasta 4 videos simultáneos sin bloqueos.
            * **Recorte de Clips (Trim):** Especifica inicio y fin para descargar solo la parte deseada.
            * **MP3 Real a 320 kbps:** Extracción con carátula en alta definición y etiquetas ID3.
            * **Buscador Integrado:** Encuentra videos en YouTube directamente dentro de la app.
            * **Cola & Base de Datos:** Historial permanente con filtros por estado y buscador en vivo.
            * **Modo Oscuro / Claro:** Tema Fluent nativo con Sun Valley.
